# Default extra-properties file, included by ../local.cfg.
#
# Intentionally empty. An overlay (overlays/<name>/local.d/extra.cfg) can
# merge its own version of this file via configMapGenerator `behavior: merge`
# to add a handful of local.cfg properties without copying the whole base
# local.cfg.
#
# Only for keys NOT already set in ../local.cfg - a duplicate key does not
# override, it becomes a list. Override those with dspace__P__* env vars.
#
