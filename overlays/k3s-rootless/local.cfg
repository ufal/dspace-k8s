# ---------------------------------------------------------------------------
# k3s-rootless local.cfg
#
# This is a PORT-SHIFTED COPY of overlays/docker-desktop/local.cfg. The only
# differences are the four external URLs, which carry :8080 — because on
# rootless k3s the ingress controller is exposed on a non-privileged host port
# (8080) instead of 80 (no sysctl available to bind :80). DSpace bakes these
# URLs into redirects and CORS origins (which are scheme+host+PORT sensitive),
# so the port must be explicit and consistent everywhere.
#
# kustomize ConfigMap merge replaces whole files, not individual lines, so this
# must stay a COMPLETE copy. Keep it in sync with docker-desktop/local.cfg when
# that file changes (everything except the four :8080 URLs below).
# ---------------------------------------------------------------------------
dspace.dir = /dspace
db.url = jdbc:postgresql://dspace-postgres-rw:5432/dspace
db.username = dspace
# db.password is read from environment variable POSTGRES_PASSWORD (set in deployment)
db.password = ${env:POSTGRES_PASSWORD}
# External hostname served by Ingress, on non-privileged host port 8080 (rootless k3s, plain HTTP).
# sslip.io resolves *.127.0.0.1.sslip.io -> 127.0.0.1 via public DNS, so no /etc/hosts (no root) needed.
dspace.hostname = dspace.127.0.0.1.sslip.io
dspace.baseUrl = http://${dspace.hostname}:8080
dspace.ui.url = http://${dspace.hostname}:8080
# The /server path is routed by the Ingress to the backend
dspace.server.url = http://${dspace.hostname}:8080/server
# Allow CORS from external hostname (origin includes the :8080 port)
rest.cors.allowed-origins = http://${dspace.hostname}:8080
# Solr now runs in a separate StatefulSet with its own service
solr.server = http://dspace-solr-service:8983/solr
management.health.solr.enabled = false
management.endpoint.health.show-details = never
useProxies = true
proxies.trusted.include_ui_ip = true
# Broad range for rootless k3s cluster networking
proxies.trusted.ipranges = 10.0.0.0/8

#### S3/MinIO Assetstore Configuration ####
# MinIO deployed in-cluster as a local S3 replacement

# S3 assetstore as Store 1 (primary and only storage)
assetstore.index.primary = 1

# S3 Assetstore Configuration (Store 1)
assetstore.s3.enabled = true
assetstore.s3.useRelativePath = true

# Credentials and endpoint loaded from environment variables (s3-assetstore-secret)
assetstore.s3.awsAccessKey = ${env:AWS_ACCESS_KEY_ID}
assetstore.s3.awsSecretKey = ${env:AWS_SECRET_ACCESS_KEY}
assetstore.s3.endpoint = ${env:S3_ENDPOINT}
assetstore.s3.awsRegionName = ${env:S3_REGION}
assetstore.s3.bucketName = ${env:S3_BUCKET_NAME}

# S3 upload configuration
assetstore.s3.subfolder = bitstreams
assetstore.s3.awsClientMaxRetry = 3
assetstore.s3.awsClientMaxConnections = 50

# Required for MinIO path-style access
assetstore.s3.pathStyleAccessEnabled = true

# Disable local/S3 synchronization - store ONLY in S3
sync.storage.service.enabled = false

# Disable presigned URL downloads: MinIO is not reachable from the host browser
s3.download.direct.enabled = false

# Reduced database connection pool for local dev
db.maxconnections = 30
db.maxwait = 10000
db.maxidle = 10
# until we finish https://github.com/ufal/clarin-dspace/issues/1156
spring.servlet.multipart.max-file-size = 10GB
spring.servlet.multipart.max-request-size = 10GB

# Personal Access Token (clarin-token) encryption key — loaded from k8s secret
clarin.token.encryption.secret = ${env:CLARIN_TOKEN_ENCRYPTION_SECRET}
