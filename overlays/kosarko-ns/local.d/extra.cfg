# kosarko-ns (ok-dspace) additions to ../../k8s/local.cfg, included from it via
# `include = local.d/extra.cfg`. Only keys the base does NOT set belong here -
# a duplicate key becomes a list instead of overriding (see k8s/local.cfg).

#include = features/enable-ror.cfg

## Register the ROR authority plugin
#plugin.named.org.dspace.content.authority.ChoiceAuthority = \
#    org.dspace.content.authority.SimpleRORAuthority = SimpleRORAuthority
#
#choices.plugin.dc.publisher = SimpleRORAuthority
#choices.presentation.dc.publisher = suggest
#authority.controlled.dc.publisher = true
#
#ror.api-url = https://api.ror.org/v2/organizations

# ---------------------------------------------------------------------------
# OAI-PMH: drop the OLAC institutional-archive description.
# description-olac.xml is a template but oai.cfg contains lindat specific defaults.
# We could use the template variables, but we rather disable the extra description.
#
# Pointing description.file.1 at a path that does not exist drops the block:
# DSpaceRepositoryConfiguration.getDescription() skips any entry whose File
# does not exist, and stops the indexed scan only on a NULL property -- so an
# absent file is skipped while description.file.0 (description.xml, the generic
# oai-identifier block) is still served. Blanking the eight description.*
# values individually would work too, but leaves an OLAC record asserting this
# is an institutional archive; there is no reason for a test instance to claim
# that at all.
#
# NOTE: robots.txt cannot help here -- harvesters do not consult it. This is
# also why this change bounces the BACKEND (this file is in local-config-map),
# unlike the frontend-only robots.txt override.
# ---------------------------------------------------------------------------
oai.description.file.1 = ${dspace.dir}/config/crosswalks/oai/description-olac.disabled.xml

# ---------------------------------------------------------------------------
#
# handle.canonical.prefix -- dspace.cfg:301 sets `http://hdl.handle.net/`,
# uncommented and live. Every seeded item's PID link therefore points off this
# instance at a handle that was never registered with the global resolver and
# must never be, so a tester following it lands on an error at hdl.handle.net
# instead of on the item. Point it at this instance's own /handle/ base.
#
# Interpolated, not hardcoded: `dspace.hostname` in k8s/local.cfg is
# stale (`hello-clarin-dspace...`) and the real host is supplied by the
# dspace__P__hostname env var in backend-deployment.yaml. Referencing
# ${dspace.hostname} directly is ONE hop across that env-var boundary, exactly
# like `rest.cors.allowed-origins` in k8s/local.cfg and like the CORS env var
# in backend-deployment.yaml -- both already proven in this deployment.
# Deliberately NOT ${dspace.ui.url}/handle/, which would read better but chains
# a second interpolation (env -> dspace.hostname -> dspace.ui.url -> here).
# ---------------------------------------------------------------------------
mail.server.disabled = true
handle.canonical.prefix = https://${dspace.hostname}/handle/
