apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Keycloak's login responses carry several large cookies; the nginx
    # default buffer is too small for them (502 "upstream sent too big header").
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    # Not the OWASP CRS of dspace-ingress: it trips on Keycloak's login and
    # token POSTs, and this host serves nothing but the test realm.
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ok-keycloak.dyn.cloud.e-infra.cz
      secretName: ok-keycloak-dyn-cloud-e-infra-cz-tls
  rules:
    - host: ok-keycloak.dyn.cloud.e-infra.cz
      http:
        # ONLY the test realm and static resources. /admin and /realms/master
        # are not published: whoever holds the master admin can mint any `sub`,
        # i.e. log in to ok-dspace as anyone who has logged in through here.
        # Use a port-forward for the admin console (README.md).
        paths:
          - path: /realms/dspace-test/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
