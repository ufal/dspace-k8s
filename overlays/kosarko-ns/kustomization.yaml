apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
namespace: kosarko-ns # <-- change to whatever you need
configMapGenerator:
  - name: local-config-map
    behavior: merge
    files:
      - local.cfg
      - submission-forms.xml
  # ---------------------------------------------------------------------------
  # The frontend's config.yml and stylesheet live in their OWN ConfigMaps, NOT as
  # extra keys in local-config-map. That is deliberate and it is the whole reason
  # this overlay is shaped this way:
  #
  # local-config-map is mounted by the BACKEND (local.cfg, user_exists.jsh) as
  # well as the frontend. Adding a key to it changes its hash suffix, which
  # changes the backend pod template, which restarts the backend -- init
  # containers, `database migrate`, `index-discovery -b`, minutes of downtime,
  # and an image re-pull on any floating tag. Doing exactly that on the local k3s
  # stack on 2026-07-28 took the backend down for an hour. A purely cosmetic
  # frontend change must not be able to bounce the backend, least of all from a
  # reconciler tick nobody is watching.
  #
  # Split this way, editing config.yml or the CSS rolls ONLY dspace-angular.
  #
  # RBAC checked: ci-reconcile/role.yaml grants core/configmaps
  # get,list,watch,create,update,patch, so the reconciler can create both. A
  # missing verb would fail every 5-minute tick with no other signal.
  # ---------------------------------------------------------------------------
  - name: angular-config
    files:
      # Complete copy of k8s/config.yml plus the themes[].headTags block.
      - config.yml
  - name: seed-testsite-css
    files:
      - seed-testsite.css
  # ---------------------------------------------------------------------------
  # robots.txt: keep this test instance out of search.
  #
  # The driver is the SITEMAP, not the meta tag. Stock robots.txt advertises two
  # `Sitemap:` lines and a backend cron regenerates sitemap0.xml nightly
  # (5 <loc>, lastmod 2026-07-30T01:15Z) -- an active invitation that grows with
  # every seeded item, and one no amount of meta-tag coverage removes.
  #
  # It also covers what the meta tag structurally cannot: themes[].headTags
  # injects <meta name="robots" content="noindex, nofollow"> during SSR, so the
  # tag is absent from every universal.excludePathPatterns route -- /search,
  # /browse/, /community-list, /statistics, /notifications, /access-control and
  # the uuid-scoped browse routes serve a bare CSR shell where it appears only
  # after hydration. That list is compiled into the image's
  # environment.production.ts -- NOT in this repo and NOT in the config.yml we
  # mount over it -- so it can move on any image bump with nothing here to
  # review. Verified live 2026-07-30 (`/search/foo` is excluded too: the
  # compiled pattern is `^/search`, unanchored).
  #
  # `Disallow: /` SUPERSEDES the meta tag for compliant crawlers rather than
  # complementing it: a disallowed URL is never fetched, so the tag is never
  # read. The tag stays as the fallback for crawlers that ignore robots.txt.
  # Consequence: this freezes rather than removes -- anything already indexed
  # needs a manual removal request.
  #
  # Replacing the whole template is both forced and smaller: subPath mounts a
  # file entire and kustomize cannot patch generated file content, so merely
  # uncommenting the stock `Disallow: /browse/*` would mean vendoring 153
  # upstream lines into this overlay, to then drift on every image bump.
  #
  # A RESTART is required. subPath ConfigMap mounts are not live-updated by
  # kubelet, and each of the container's 7 pm2 workers caches the compiled
  # template for its lifetime (observed: after restoring the file on disk, ~6/7
  # of responses still served the edited version). The generator's name-suffix
  # hash is what rolls dspace-angular, and only dspace-angular per the split
  # above -- do not add disableNameSuffixHash. Verify once the rollout has
  # completed: zero `Sitemap:` lines.
  # ---------------------------------------------------------------------------
  - name: robots-txt-ejs
    files:
      - robots.txt.ejs
#images:
#  - name: dataquest/dspace
#    newName: ufal/dspace
#    newTag: 2026.1-rc1

# -------------------------------------------------------------------------
# 3️⃣  Patches that change the public hostname and S3 backup configuration
# -------------------------------------------------------------------------
patches:
  - path: sealed-secrets.yaml
  - path: angular-deployment.yaml
    target:
      kind: Deployment
      name: dspace-angular
  # DSpace backend can read any property from the env
  # but if this is getting too large consider overlaying local.cfg
  - path: backend-deployment.yaml
    target:
      kind: Deployment
      name: dspace-backend
  # PostgreSQL backup configuration - customize S3 endpoint and bucket
  - path: postgres-cnpg-backup-plugin-config.yaml
    target:
      kind: ObjectStore
      name: dspace-barman-store
  # ---------------------------------------------------------------------------
  # health-report: suspended on this instance, not re-addressed.
  #
  # k8s/dspace-cronjobs.yaml:39 runs `dspace health-report -e
  # YOUR.EMAIL@DOMAIN.COM` daily -- a placeholder that shipped enabled. With
  # mail.server.disabled = true (overlays/kosarko-ns/local.cfg) it can no longer
  # send anything, so this patch is not what stops the mail; it stops the job
  # from existing as a trap. Leaving it scheduled means the placeholder address
  # survives in git as something that goes live the moment mail is enabled, and
  # a daily JVM start produces a report on a synthetic corpus that no one reads.
  #
  # Suspended rather than re-addressed because there is no correct address to
  # write here: a health report about fabricated content is not something a
  # human should receive. If someone does want it, flip suspend to false and set
  # a real address in the base -- one line, and the base is where the placeholder
  # actually belongs.
  #
  # Deliberately NOT suspended: subscription-send D/W/M. They exercise a real
  # code path, which on a test instance is the point, and mail.server.disabled
  # already makes them unable to deliver.
  # ---------------------------------------------------------------------------
  - target:
      kind: CronJob
      name: dspace-health-report
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      kind: Ingress
      name: dspace-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "ok-dspace.dyn.cloud.e-infra.cz"
      - op: replace
        path: /spec/tls/0/secretName
        value: "ok-dspace-dyn-cloud-e-infra-cz-tls" #replace . with - and append -tls
      - op: replace
        path: /spec/rules/0/host
        value: "ok-dspace.dyn.cloud.e-infra.cz"
# The newTag values below are MAINTAINED BY CI, by
# .github/workflows/pin-ok-dspace.yml. An automated pin writes the git SHA of
# the source commit that produced the image, so this file records which commit
# is deployed - but the value is an image TAG, not necessarily a SHA: a manual
# pin may set any tag, and an entry with no newTag at all inherits from
# ../../k8s until CI first pins it. Read it as "the tag this environment runs",
# and check the running version at /server/api and /static/VERSION_D if you
# need certainty. Hand-edits survive only until the next pin of that component.
#
# dspace + dspace-solr are built from the same ufal/clarin-dspace commit, so
# they always move together. dspace-angular moves independently.
#
# THE `name:` VALUES ARE SELECTOR KEYS, NOT IMAGE NAMES. CI matches on
# `dataquest/dspace` (the pre-rename name from ../../k8s) and rewrites newTag on
# whatever it finds. Renaming these breaks the match; the workflow now fails
# loudly if a key it expects is missing, but do not rename them casually.
#
# This file was reformatted once, deliberately, into yq's canonical output
# (blank lines dropped, inline comment spacing normalised) so that every
# CI-generated commit afterwards is a clean one-line tag change instead of the
# first one silently reformatting everything. Verified byte-identical rendering
# before and after. Do not "restore" the blank lines.
images:
  - name: dataquest/dspace
    newName: ufal/dspace
    newTag: 55d032f33580942d0a2c7f11d888db684cad9a86
  - name: dataquest/dspace-solr
    newName: ufal/dspace-solr
    newTag: 55d032f33580942d0a2c7f11d888db684cad9a86
  - name: dataquest/dspace-angular
    newName: ufal/dspace-angular
    newTag: d4868c36a89430f68a84a0b8a98fe67b5b9edd36
