# S3 credentials + ServiceAccount consumed by KServe's storage-initializer
# init-container when an InferenceService's storageUri is s3://...
# Annotation keys are KServe's documented s3 credential-annotation contract.
apiVersion: v1
kind: Secret
metadata:
  name: models-s3-secret
  namespace: dspace-k3s
  annotations:
    serving.kserve.io/s3-endpoint: "minio-service.dspace-k3s.svc.cluster.local:9000" # host:port, NO scheme
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-region: "us-east-1"
    serving.kserve.io/s3-useanoncredential: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: models-s3-sa
  namespace: dspace-k3s
secrets:
  - name: models-s3-secret
